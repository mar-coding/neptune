name: base-pipeline

on:
  push:
    branches:
    - main
    - development
  pull_request:
    branches:
    - main
    - development

jobs:

  build:
    name: Build and test with coverage
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    # keep in sync with hack/tools/Dockerfile
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    # all packages, including shared ones that the per-component Makefiles skip
    - name: Unit tests with coverage
      run: go test -race -count=1 -coverprofile=coverage.out $(go list ./... | grep -v /e2e)

    - name: Coverage
      run: go tool cover -func=coverage.out | tail -1

  integration:
    name: Integration tests (TimescaleDB)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run integration tests
      run: ./hack/test-integration.sh
