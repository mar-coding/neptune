name: e2e

on:
  push:
    branches:
    - main
    - development
  pull_request:
    branches:
    - main
    - development
jobs:

  e2e:
    name: Run e2e tests on Pull requests
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          version: v0.13.0
          install_only: true

      # creates a kind cluster with systemautoscaler/kindest-node and config/cluster-conf/kind.conf,
      # installs CRDs/RBAC and runs the Ginkgo suites inside the tools container
      - name: Run e2e tests
        run: ./hack/test-e2e.sh
